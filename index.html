<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rafael Tashiro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Contato de Rafael Tashiro, BI & Analytics Specialist – Team Lead na Swift.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column; photo+name header, QR tile as the hero, contact blocks with actions */
:root{--bg:#eef1f5;--surface:#fff;--fg:#141a24;--muted:#5b6575;--line:#d8dee7;--accent:#1f4fd1;--accent-soft:#e3eafc;--on-accent:#fff;--wa:#128c4a;--on-wa:#fff;
 --display:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e131b;--surface:#171e2a;--fg:#eef2f8;--muted:#97a2b4;--line:#273142;--accent:#7ea2ff;--accent-soft:#1c2843;--on-accent:#0e131b;--wa:#25d366;--on-wa:#08291a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e131b;--surface:#171e2a;--fg:#eef2f8;--muted:#97a2b4;--line:#273142;--accent:#7ea2ff;--accent-soft:#1c2843;--on-accent:#0e131b;--wa:#25d366;--on-wa:#08291a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--display);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px}
.wrap{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:center;gap:16px}
header img{width:76px;height:76px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 1px var(--line)}
h1{margin:0;font-size:1.65rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.role{margin:6px 0 0;font-size:.92rem;color:var(--muted);font-weight:500;line-height:1.35}
.role b{color:var(--fg);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);padding:4px;border-radius:12px}
.tabs button{font:700 .9rem var(--display);border:0;border-radius:9px;padding:10px 8px;background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.qr{width:100%;aspect-ratio:1;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#fff}
.qr svg{display:block;width:100%;height:100%}
.hint{margin:0;text-align:center;font-size:.88rem;color:var(--muted);line-height:1.4}
.item{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:2px}.item:last-child{padding-bottom:2px}
.label{font:500 .7rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 3px}
.val{font:500 .95rem var(--mono);overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;font:700 .85rem var(--display);border:0;border-radius:999px;padding:10px 16px;cursor:pointer;text-decoration:none;background:var(--accent-soft);color:var(--accent);flex:1 1 auto}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.wa{background:var(--wa);color:var(--on-wa)}
.btn:focus-visible,.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.ghost{flex:0 0 auto;background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-top:8px}
.hero img{width:148px;height:148px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 4px var(--surface),0 0 0 5px var(--line);margin-bottom:10px}
.hero h1{font-size:2.4rem;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:0}
.hero .role{margin:4px 0 2px;font-size:1.02rem}
.btn.big{width:100%;padding:15px 18px;font-size:1rem}
.btn{gap:8px}.ic{width:1.15em;height:1.15em;flex:none}
.logo{display:block;margin:6px 0 16px}.logo img{height:24px;width:auto;display:block;box-shadow:none;border-radius:0;margin:0}
</style>
